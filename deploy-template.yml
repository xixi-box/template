name: Build and Deploy

on:
  workflow_dispatch:
    inputs:
      target_env:
        description: Target deployment environment / self-hosted runner label
        required: true
        default: aliyun
        type: choice
        options:
          - aliyun
          - wsl
      database:
        description: Production database engine
        required: true
        default: mysql
        type: choice
        options:
          - mysql
          - postgres

# Required repository or organization configuration:
#   Variables: ALIYUN_ACR_REGISTRY, ALIYUN_ACR_USERNAME
#   Secrets:   ALIYUN_ACR_PASSWORD, DATABASE_PASSWORD, REDIS_PASSWORD
#              DATABASE_ROOT_PASSWORD (required when MySQL is selected)
# Optional repository variables:
#   ALIYUN_ACR_IMAGE_NAME - defaults to wangshun_build/<repository>
#   DEPLOY_DOCKERFILE     - defaults to ./Dockerfile
#   DATABASE_NAME         - defaults to app
#   DATABASE_USERNAME     - defaults to app
#   APP_PORT              - defaults to 8080

env:
  GHCR_REGISTRY: ghcr.io
  GHCR_IMAGE_NAME: ${{ github.repository }}
  ALIYUN_ACR_REGISTRY: ${{ vars.ALIYUN_ACR_REGISTRY }}
  ALIYUN_ACR_USERNAME: ${{ vars.ALIYUN_ACR_USERNAME }}
  ALIYUN_ACR_IMAGE_NAME: ${{ vars.ALIYUN_ACR_IMAGE_NAME || format('wangshun_build/{0}', github.event.repository.name) }}
  DEPLOY_DOCKERFILE: ${{ vars.DEPLOY_DOCKERFILE || './Dockerfile' }}
  DATABASE_NAME: ${{ vars.DATABASE_NAME || 'app' }}
  DATABASE_USERNAME: ${{ vars.DATABASE_USERNAME || 'app' }}
  APP_PORT: ${{ vars.APP_PORT || '8080' }}
  IMAGE_TAG: ${{ github.sha }}

jobs:
  build-and-push:
    name: Build and Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Validate build configuration
        shell: bash
        env:
          ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ALIYUN_ACR_REGISTRY" ]] || missing+=(ALIYUN_ACR_REGISTRY)
          [[ -n "$ALIYUN_ACR_USERNAME" ]] || missing+=(ALIYUN_ACR_USERNAME)
          [[ -n "$ALIYUN_ACR_PASSWORD" ]] || missing+=(ALIYUN_ACR_PASSWORD)
          [[ -n "$ALIYUN_ACR_IMAGE_NAME" ]] || missing+=(ALIYUN_ACR_IMAGE_NAME)

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          if [[ ! -f "$DEPLOY_DOCKERFILE" ]]; then
            echo "Dockerfile not found: $DEPLOY_DOCKERFILE" >&2
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.GHCR_REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Log in to Aliyun ACR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.ALIYUN_ACR_REGISTRY }}
          username: ${{ env.ALIYUN_ACR_USERNAME }}
          password: ${{ secrets.ALIYUN_ACR_PASSWORD }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push image to both registries
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ env.DEPLOY_DOCKERFILE }}
          push: true
          tags: |
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.GHCR_REGISTRY }}/${{ env.GHCR_IMAGE_NAME }}:latest
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.ALIYUN_ACR_REGISTRY }}/${{ env.ALIYUN_ACR_IMAGE_NAME }}:latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to ${{ github.event.inputs.target_env }}
    needs: build-and-push
    runs-on: [self-hosted, "${{ github.event.inputs.target_env }}"]
    environment: ${{ github.event.inputs.target_env }}
    permissions:
      contents: read
      packages: read
    concurrency:
      group: deploy-${{ github.repository }}-${{ github.event.inputs.target_env }}
      cancel-in-progress: false
    env:
      DATABASE_ENGINE: ${{ github.event.inputs.database }}
      ALIYUN_ACR_PASSWORD: ${{ secrets.ALIYUN_ACR_PASSWORD }}
      DATABASE_PASSWORD: ${{ secrets.DATABASE_PASSWORD }}
      DATABASE_ROOT_PASSWORD: ${{ secrets.DATABASE_ROOT_PASSWORD }}
      REDIS_PASSWORD: ${{ secrets.REDIS_PASSWORD }}

    steps:
      - name: Deploy with GHCR primary and Aliyun ACR fallback
        shell: bash
        run: |
          set -euo pipefail

          missing=()
          [[ -n "$ALIYUN_ACR_REGISTRY" ]] || missing+=(ALIYUN_ACR_REGISTRY)
          [[ -n "$ALIYUN_ACR_USERNAME" ]] || missing+=(ALIYUN_ACR_USERNAME)
          [[ -n "$ALIYUN_ACR_PASSWORD" ]] || missing+=(ALIYUN_ACR_PASSWORD)
          [[ -n "$ALIYUN_ACR_IMAGE_NAME" ]] || missing+=(ALIYUN_ACR_IMAGE_NAME)
          [[ -n "$DATABASE_PASSWORD" ]] || missing+=(DATABASE_PASSWORD)
          [[ -n "$REDIS_PASSWORD" ]] || missing+=(REDIS_PASSWORD)
          if [[ "$DATABASE_ENGINE" == "mysql" && -z "$DATABASE_ROOT_PASSWORD" ]]; then
            missing+=(DATABASE_ROOT_PASSWORD)
          fi

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing GitHub Actions configuration: %s\n' "${missing[*]}" >&2
            exit 1
          fi

          export DOCKER_CONFIG="$(mktemp -d)"
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT

          printf '%s' "${{ github.token }}" |
            docker login "$GHCR_REGISTRY" -u "${{ github.actor }}" --password-stdin
          printf '%s' "$ALIYUN_ACR_PASSWORD" |
            docker login "$ALIYUN_ACR_REGISTRY" -u "$ALIYUN_ACR_USERNAME" --password-stdin

          GHCR_REPOSITORY="$GHCR_REGISTRY/$GHCR_IMAGE_NAME"
          ACR_REPOSITORY="$ALIYUN_ACR_REGISTRY/$ALIYUN_ACR_IMAGE_NAME"

          if docker pull "$GHCR_REPOSITORY:$IMAGE_TAG"; then
            IMAGE_REPOSITORY="$GHCR_REPOSITORY"
          elif docker pull "$ACR_REPOSITORY:$IMAGE_TAG"; then
            echo "GHCR pull failed; using Aliyun ACR fallback."
            IMAGE_REPOSITORY="$ACR_REPOSITORY"
          else
            echo "Unable to pull image $IMAGE_TAG from GHCR or Aliyun ACR." >&2
            exit 1
          fi

          PROJECT_NAME="$(printf '%s' "${{ github.event.repository.name }}" |
            tr '[:upper:]' '[:lower:]' |
            sed 's/[^a-z0-9_-]/-/g')"
          DEPLOY_DIR="$HOME/deployments/$PROJECT_NAME"
          mkdir -p "$DEPLOY_DIR"
          chmod 700 "$DEPLOY_DIR"
          cd "$DEPLOY_DIR"

          cat > compose.yaml <<'COMPOSE_EOF'
          services:
            mysql:
              image: mysql:8.0
              profiles: [mysql]
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: ${DATABASE_ROOT_PASSWORD:?DATABASE_ROOT_PASSWORD is required}
                MYSQL_DATABASE: ${DATABASE_NAME:-app}
                MYSQL_USER: ${DATABASE_USERNAME:-app}
                MYSQL_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
                TZ: Asia/Shanghai
              volumes:
                - mysql-data:/var/lib/mysql
              command:
                - --character-set-server=utf8mb4
                - --collation-server=utf8mb4_unicode_ci
              healthcheck:
                test: [CMD-SHELL, "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
                interval: 10s
                timeout: 5s
                retries: 12
                start_period: 30s

            postgres:
              image: postgres:16-alpine
              profiles: [postgres]
              restart: unless-stopped
              environment:
                POSTGRES_DB: ${DATABASE_NAME:-app}
                POSTGRES_USER: ${DATABASE_USERNAME:-app}
                POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
                TZ: Asia/Shanghai
              volumes:
                - postgres-data:/var/lib/postgresql/data
              healthcheck:
                test: [CMD-SHELL, "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
                interval: 10s
                timeout: 5s
                retries: 12
                start_period: 20s

            redis:
              image: redis:7-alpine
              restart: unless-stopped
              environment:
                REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
              command: [sh, -c, 'exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
              volumes:
                - redis-data:/data
              healthcheck:
                test: [CMD-SHELL, 'redis-cli -a "$$REDIS_PASSWORD" ping | grep PONG']
                interval: 10s
                timeout: 5s
                retries: 10

            app:
              image: ${IMAGE_REPOSITORY:?IMAGE_REPOSITORY is required}:${IMAGE_TAG:?IMAGE_TAG is required}
              restart: unless-stopped
              environment:
                APP_ENV: prod
                SPRING_PROFILES_ACTIVE: prod
                SERVER_PORT: 8080
                SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL:?SPRING_DATASOURCE_URL is required}
                SPRING_DATASOURCE_USERNAME: ${DATABASE_USERNAME:-app}
                SPRING_DATASOURCE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD is required}
                SPRING_DATA_REDIS_HOST: redis
                SPRING_DATA_REDIS_PORT: 6379
                SPRING_DATA_REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD is required}
              ports:
                - "${APP_PORT:-8080}:8080"

          volumes:
            mysql-data:
            postgres-data:
            redis-data:
          COMPOSE_EOF

          if [[ "$DATABASE_ENGINE" == "mysql" ]]; then
            SPRING_DATASOURCE_URL="jdbc:mysql://mysql:3306/$DATABASE_NAME?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true"
          else
            SPRING_DATASOURCE_URL="jdbc:postgresql://postgres:5432/$DATABASE_NAME"
            # Compose interpolates the whole model before filtering profiles.
            # The inactive MySQL service therefore needs a harmless fallback.
            DATABASE_ROOT_PASSWORD="${DATABASE_ROOT_PASSWORD:-$DATABASE_PASSWORD}"
          fi

          export IMAGE_REPOSITORY IMAGE_TAG DATABASE_NAME DATABASE_USERNAME
          export DATABASE_PASSWORD DATABASE_ROOT_PASSWORD REDIS_PASSWORD
          export SPRING_DATASOURCE_URL APP_PORT

          docker compose --project-name "$PROJECT_NAME" --profile "$DATABASE_ENGINE" config --quiet
          docker compose --project-name "$PROJECT_NAME" --profile "$DATABASE_ENGINE" \
            up -d --wait --wait-timeout 180 "$DATABASE_ENGINE" redis
          docker compose --project-name "$PROJECT_NAME" --profile "$DATABASE_ENGINE" \
            up -d --remove-orphans app
          docker compose --project-name "$PROJECT_NAME" --profile "$DATABASE_ENGINE" ps

          cleanup_repository_images() {
            local repository="$1"
            local current_ref="$2"
            local stale_refs=()

            mapfile -t stale_refs < <(
              docker image ls "$repository" --format '{{.Repository}}:{{.Tag}}' |
                grep -Fvx "$current_ref" |
                grep -v ':<none>$' |
                sort -u || true
            )

            if (( ${#stale_refs[@]} > 0 )); then
              printf 'Removing old project images from %s:\n' "$repository"
              printf '  %s\n' "${stale_refs[@]}"
              docker image rm -f "${stale_refs[@]}"
            fi
          }

          # Keep the running immutable SHA only. Repository matching and the OCI
          # source label scope cleanup to this project on a shared Docker host.
          cleanup_repository_images "$GHCR_REPOSITORY" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          cleanup_repository_images "$ACR_REPOSITORY" "$IMAGE_REPOSITORY:$IMAGE_TAG"
          docker image prune -f \
            --filter "label=org.opencontainers.image.source=https://github.com/${{ github.repository }}"

          echo "Deployment completed: $IMAGE_REPOSITORY:$IMAGE_TAG"
