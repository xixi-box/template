name: Enterprise CI/CD Pipeline Template

on:
  # 日常开发阶段建议保持注释，依赖手动触发以控制发版频率
  # push:
  #   branches: [ main, master, release/* ]
  workflow_dispatch:
    inputs:
      target_env:
        description: 'Target Deployment Environment (e.g., aliyun, wsl, prod, staging)'
        required: true
        default: 'aliyun'
        type: choice
        options:
          - aliyun
          - wsl

env:
  # ==========================================
  # Global Configuration (Single Source of Truth)
  # ==========================================
  PROJECT_NAME: enterprise-microservice          # 项目统一标识，用于容器命名前缀与网络隔离
  REGISTRY: crpi-r1wme86kfaw7rr3f.cn-shanghai.personal.cr.aliyuncs.com
  IMAGE_NAMESPACE: wangshun_build/microservices  # 镜像仓库命名空间
  
  # 注意：涉及密码、密钥等敏感信息，必须通过 ${{ secrets.XXX }} 引用，严禁硬编码

jobs:
  # ==========================================
  # Stage 1: Build & Push (Cloud Build Node)
  # ==========================================
  build-and-push:
    name: Build and Push Images
    runs-on: ubuntu-latest
    outputs:
      VERSION: ${{ steps.generate_version.outputs.VERSION }}

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Build Environment (JDK & Node.js)
        # 根据实际技术栈保留相应的 Setup 动作
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Generate Immutable Version Tag
        id: generate_version
        # 截取 Git Commit Hash 的前 7 位作为版本号，确保镜像不可变且可追溯
        run: echo "VERSION=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Build and Push Artifacts
        run: |
          VERSION=${{ steps.generate_version.outputs.VERSION }}
          echo "Building images for version: $VERSION"
          
          # [示例] 业务应用镜像构建指令
          # docker build -f Dockerfile.app -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}:app-service-$VERSION -t ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}:app-service-latest .
          # docker push --all-tags ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}

  # ==========================================
  # Stage 2: Deploy (Target Edge/Cloud Node)
  # ==========================================
  deploy:
    name: Deploy to ${{ github.event.inputs.target_env || 'aliyun' }}
    needs: build-and-push
    # 动态节点调度：根据触发参数将任务路由至指定标签的 Self-hosted Runner
    runs-on:[self-hosted, "${{ github.event.inputs.target_env || 'aliyun' }}"]
    env:
      VERSION: ${{ needs.build-and-push.outputs.VERSION }}

    steps:
      - name: Login to Container Registry
        run: |
          echo "${{ secrets.ACR_PASSWORD }}" | docker login ${{ env.REGISTRY }} -u ${{ secrets.ACR_USERNAME }} --password-stdin

      - name: Infrastructure Provisioning & Deployment
        run: |
          # 1. 初始化工作区沙盒，确保环境隔离
          mkdir -p ${{ env.PROJECT_NAME }} && cd ${{ env.PROJECT_NAME }}

          echo "=== Step 1: Generating Infrastructure as Code (IaC) ==="
          
          # 2. 动态生成服务编排文件
          cat > docker-compose.yml << 'EOF'
          # ============================================================
          # Generated by CI/CD Pipeline
          # Project: ${{ env.PROJECT_NAME }} | Version: ${{ env.VERSION }}
          # ============================================================
          services:
            # -------------------------------------------------------
            # Middleware: MySQL
            # -------------------------------------------------------
            mysql:
              image: mysql:8.0
              container_name: ${{ env.PROJECT_NAME }}-mysql
              restart: unless-stopped
              environment:
                MYSQL_ROOT_PASSWORD: ${{ secrets.DB_ROOT_PASSWORD }}
                MYSQL_DATABASE: ${{ env.PROJECT_NAME }}_db
              ports:
                - "3306:3306"
              volumes:
                - mysql-data:/var/lib/mysql
                # 可选：挂载初始化脚本
                # - ./init-sql:/docker-entrypoint-initdb.d
              command:
                - --character-set-server=utf8mb4
                - --collation-server=utf8mb4_unicode_ci
                - --default-authentication-plugin=mysql_native_password

            # -------------------------------------------------------
            # Middleware: Redis
            # -------------------------------------------------------
            redis:
              image: redis:7-alpine
              container_name: ${{ env.PROJECT_NAME }}-redis
              restart: unless-stopped
              ports:
                - "6379:6379"
              volumes:
                - redis-data:/data
              command: redis-server --appendonly yes

            # -------------------------------------------------------
            # Middleware: Nacos Registry & Config Center
            # -------------------------------------------------------
            nacos:
              image: nacos/nacos-server:v2.3.0
              container_name: ${{ env.PROJECT_NAME }}-nacos
              restart: unless-stopped
              environment:
                - PREFER_HOST_MODE=hostname
                - MODE=standalone
                - SPRING_DATASOURCE_PLATFORM=mysql
                - MYSQL_SERVICE_HOST=mysql
                - MYSQL_SERVICE_PORT=3306
                - MYSQL_SERVICE_DB_NAME=nacos_config
                - MYSQL_SERVICE_USER=${{ secrets.DB_USER }}
                - MYSQL_SERVICE_PASSWORD=${{ secrets.DB_PASSWORD }}
                - JVM_XMS=512m
                - JVM_XMX=512m
              ports:
                - "8848:8848"
                - "9848:9848"
              depends_on:
                - mysql

            # -------------------------------------------------------
            # Business Application: App Service (示例)
            # -------------------------------------------------------
            app-service:
              image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}:app-service-${{ env.VERSION }}
              container_name: ${{ env.PROJECT_NAME }}-app-service
              restart: unless-stopped
              environment:
                - SPRING_PROFILES_ACTIVE=prod
                - DB_HOST=mysql
                - REDIS_HOST=redis
                - NACOS_HOST=nacos
              ports:
                - "8080:8080"
              depends_on:
                - mysql
                - redis
                - nacos

          networks:
            default:
              name: ${{ env.PROJECT_NAME }}-network
              driver: bridge

          volumes:
            mysql-data:
            redis-data:
          EOF

          echo "=== Step 2: Pre-deployment Cleanup ==="
          # Graceful shutdown of existing compose stack
          docker compose down 2>/dev/null || true
          
          # Force remove any residual containers matching the project prefix to prevent naming conflicts
          docker ps -aq --filter "name=${{ env.PROJECT_NAME }}-" | xargs -r docker rm -f

          echo "=== Step 3: Pull Latest Images ==="
          docker compose pull

          echo "=== Step 4: Bootstrapping Infrastructure ==="
          docker compose up -d mysql redis
          
          # MySQL Health Check Waiter
          echo "Waiting for MySQL initialization..."
          for i in {1..30}; do
            if docker exec ${{ env.PROJECT_NAME }}-mysql mysqladmin ping -h localhost -uroot -p"${{ secrets.DB_ROOT_PASSWORD }}" 2>/dev/null; then
              echo "[OK] MySQL is ready."
              break
            fi
            if [ $i -eq 30 ]; then echo "[ERROR] MySQL initialization timeout."; exit 1; fi
            sleep 3
          done

          echo "=== Step 5: Bootstrapping Middleware ==="
          docker compose up -d nacos
          
          # Nacos Health Check Waiter
          echo "Waiting for Nacos initialization..."
          for i in {1..30}; do
            if curl -sf http://localhost:8848/nacos/v1/ns/instance/list?serviceName=nacos > /dev/null 2>&1; then
              echo "[OK] Nacos is ready."
              break
            fi
            if [ $i -eq 30 ]; then echo "[ERROR] Nacos initialization timeout."; exit 1; fi
            sleep 3
          done

          echo "=== Step 6: Starting Business Services ==="
          docker compose up -d app-service
          
          # Application Health Check Waiter (Replace with actual /health endpoint)
          echo "Waiting for Application to start..."
          for i in {1..20}; do
            if curl -sf http://localhost:8080/ > /dev/null 2>&1; then
              echo "[OK] Application is running."
              break
            fi
            if [ $i -eq 20 ]; then 
              echo "[ERROR] Application health check failed. Fetching recent logs:"
              docker compose logs app-service --tail 50
              exit 1
            fi
            sleep 3
          done

          echo "=== Step 7: Post-deployment Housekeeping ==="
          # Clean up dangling images to release disk space
          docker image prune -f

          echo "============================================================"
          echo "Deployment Completed Successfully! Target: ${{ github.event.inputs.target_env || 'aliyun' }} | Version: $VERSION"
          echo "============================================================"