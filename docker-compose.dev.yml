# ============================================================
# 本地开发环境 Docker Compose 模板
# 适用: Spring Boot + Vue 前后端分离项目
# 来源: code-craft + lumina-rpc + gpu-reserve 三项目合并
#
# 设计原则:
#   - 只启动基础设施 (MySQL/Redis/Nacos 等)，Java 服务在 IDE 中运行
#   - 所有密码通过 .env 或环境变量注入，禁止硬编码
#   - 每个 service 都有 healthcheck，保证启动顺序
#
# 使用方式:
#   1. 复制到项目根目录: docker-compose.dev.yml
#   2. 复制 .env.example → .env 并填入实际值
#   3. docker compose -f docker-compose.dev.yml up -d
# ============================================================

services:
  # ============================================================
  # MySQL 8.0
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: <project>-mysql
    hostname: <project>-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${<PROJECT>_MYSQL_ROOT_PASSWORD:?set <PROJECT>_MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${<PROJECT>_MYSQL_DATABASE:-<project>_db}
      MYSQL_USER: ${<PROJECT>_MYSQL_USERNAME:-<project>_user}
      MYSQL_PASSWORD: ${<PROJECT>_MYSQL_PASSWORD:?set <PROJECT>_MYSQL_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "${<PROJECT>_MYSQL_PORT:-3306}:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      # [可选] 挂载初始化 SQL
      # - ./sql/init.sql:/docker-entrypoint-initdb.d/1_init.sql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    networks:
      - <project>-network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$${MYSQL_USER} -p$${MYSQL_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  # ============================================================
  # Redis 7
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: <project>-redis
    restart: unless-stopped
    ports:
      - "${<PROJECT>_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    # 如需持久化: command: redis-server --appendonly yes
    networks:
      - <project>-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

