# ============================================================
# Nginx 反向代理 + SPA 模板 (微服务生产环境)
# 适用: Spring Cloud / Dubbo 微服务前端网关
# 来源: code-craft + lumina-rpc + interview 三项目合并
#
# 使用方式:
#   1. 复制到项目目录并重命名，如 nginx.conf
#   2. 替换所有 <占位符> 和 upstream 块
#   3. 按需增删 location 块
# ============================================================

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    # --- Docker DNS 解析器 (容器环境必须) ---
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;

    # --- 请求体/缓冲区 (上传文件场景) ---
    large_client_header_buffers 8 32k;
    client_header_buffer_size 8k;
    client_max_body_size 100m;
    proxy_buffer_size 128k;
    proxy_buffers 8 256k;
    proxy_busy_buffers_size 256k;

    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;

    # ============================================================
    # [必改] Upstream 后端服务定义
    # Docker 环境用服务名，物理机/WSL 用 host.docker.internal
    # ============================================================
    upstream <app-service> {
        server <app-service>:<port>;
    }

    # 按需添加更多 upstream...
    # upstream user_service {
    #     server user-service:8124;
    # }

    # --- Gzip 压缩 ---
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/xml+rss
        application/json
        image/svg+xml;

    # ============================================================
    # 主 Server 块
    # ============================================================
    server {
        listen 80;
        server_name <your-domain-or-localhost>;

        # --- SPA 前端静态文件 ---
        # 方案A: 代理到前端容器 (微服务场景)
        location / {
            proxy_pass http://<frontend-service>;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # 方案B: 本地静态文件 (单容器部署)
        # location / {
        #     root   /usr/share/nginx/html;
        #     index  index.html index.htm;
        #     try_files $uri $uri/ /index.html;
        # }

        # ============================================================
        # [必改] API 反向代理路由
        # 规则: /api/<服务名>/ → 对应 upstream
        # 注意: 更具体的路由放在前面 (Nginx 最长前缀匹配)
        # ============================================================

        # --- 主应用 API (含 WebSocket 支持) ---
        location /api/ {
            proxy_pass http://<app-service>;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # WebSocket 升级
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
        }

        # --- 更多服务路由 (按需复制) ---
        # location /api/user/ {
        #     proxy_pass http://user_service;
        #     proxy_set_header Host $host;
        #     proxy_set_header X-Real-IP $remote_addr;
        #     proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        #     proxy_set_header X-Forwarded-Proto $scheme;
        # }

        # --- 健康检查端点 ---
        location /health {
            access_log off;
            return 200 "healthy\n";
            add_header Content-Type text/plain;
        }

        # --- 禁止访问隐藏文件 ---
        location ~ /\. {
            deny all;
            access_log off;
            log_not_found off;
        }
    }

    # ============================================================
    # [可选] 额外 Server 块 - 多域名/多服务
    # ============================================================
    # server {
    #     listen 80;
    #     server_name <another-domain>;
    #
    #     location / {
    #         proxy_pass http://host.docker.internal:<local-port>;
    #         proxy_set_header Host $host;
    #         proxy_set_header X-Real-IP $remote_addr;
    #         proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    #         proxy_set_header X-Forwarded-Proto $scheme;
    #         proxy_http_version 1.1;
    #         proxy_set_header Upgrade $http_upgrade;
    #         proxy_set_header Connection "upgrade";
    #     }
    # }
}
