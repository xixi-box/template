# ============================================================
# Nginx 纯静态 SPA 模板
# 适用: 纯前端项目，无反向代理需求
# 来源: code-craft/nginx.frontend.conf + interview/nginx.conf 合并
#
# 与 nginx-spa-proxy.conf 的区别:
#   - 本模板: 纯静态文件托管，无 upstream / proxy_pass
#   - proxy 版: 含反向代理路由，适合前后端分离微服务
# ============================================================

server {
    listen 80;
    server_name <your-domain-or-localhost>;

    # 静态文件根目录
    root /usr/share/nginx/html;
    # 如前端放在子目录: root /usr/share/nginx/html/dist;
    index index.html index.htm;

    # SPA 路由回退 (Vue Router history 模式必须)
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 静态资源长缓存 (文件名含 hash 时可安全设置 1 年)
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }
}
